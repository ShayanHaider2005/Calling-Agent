name: unit-tests

on:
  push:
    branches: [main, overnight-build, overnight-build-2]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # Lightweight deps only — no torch, no model downloads, no cost.
          python -m pip install -r requirements-test.txt

      - name: Run CPU-only unit tests
        run: |
          python -m pytest tests/test_eval.py tests/test_brain.py tests/test_ingest.py tests/test_packs.py -v
